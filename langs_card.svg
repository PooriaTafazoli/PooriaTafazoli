<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 230" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGlowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#c084fc;#f472b6;#10B981;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#f472b6;#10B981;#38bdf8;#c084fc" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#f472b6">
        <animate attributeName="stop-color" values="#f472b6;#10B981;#38bdf8;#c084fc;#f472b6" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <filter id="glowFilter2" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A101F" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Language Progress Bar Gradients -->
    <linearGradient id="pyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="exGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="jsGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="webGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- React Bits BorderGlow Outer Frame -->
  <rect width="540" height="230" rx="16" fill="url(#bgGrad2)" stroke="url(#cardGlowGrad2)" stroke-width="2" filter="url(#glowFilter2)"/>

  <!-- Title Row -->
  <text x="24" y="38" font-family="Consolas, Fira Code, monospace" font-size="16" font-weight="bold" fill="#22D3EE" letter-spacing="1">Most Used Tech Stack</text>
  <text x="516" y="35" font-family="Consolas, Fira Code, monospace" font-size="11" font-weight="bold" fill="#94A3B8" text-anchor="end">Full-Stack Core</text>

  <line x1="24" y1="54" x2="516" y2="54" stroke="#1E293B" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- Language 1: Python & Django -->
  <g transform="translate(24, 76)">
    <circle cx="6" cy="0" r="5" fill="#38bdf8"/>
    <text x="18" y="4" font-family="Consolas, Fira Code, monospace" font-size="13" font-weight="bold" fill="#F8FAFC">Python / Django</text>
    <text x="492" y="4" font-family="Consolas, Fira Code, monospace" font-size="13" font-weight="bold" fill="#38bdf8" text-anchor="end">40%</text>
    <rect x="18" y="12" width="474" height="6" rx="3" fill="#1E293B"/>
    <rect x="18" y="12" width="190" height="6" rx="3" fill="url(#pyGrad)"/>
  </g>

  <!-- Language 2: Elixir & Phoenix -->
  <g transform="translate(24, 112)">
    <circle cx="6" cy="0" r="5" fill="#c084fc"/>
    <text x="18" y="4" font-family="Consolas, Fira Code, monospace" font-size="13" font-weight="bold" fill="#F8FAFC">Elixir / Phoenix</text>
    <text x="492" y="4" font-family="Consolas, Fira Code, monospace" font-size="13" font-weight="bold" fill="#c084fc" text-anchor="end">25%</text>
    <rect x="18" y="12" width="474" height="6" rx="3" fill="#1E293B"/>
    <rect x="18" y="12" width="118" height="6" rx="3" fill="url(#exGrad)"/>
  </g>

  <!-- Language 3: Next.js & React -->
  <g transform="translate(24, 148)">
    <circle cx="6" cy="0" r="5" fill="#f472b6"/>
    <text x="18" y="4" font-family="Consolas, Fira Code, monospace" font-size="13" font-weight="bold" fill="#F8FAFC">Next.js / React / JS</text>
    <text x="492" y="4" font-family="Consolas, Fira Code, monospace" font-size="13" font-weight="bold" fill="#f472b6" text-anchor="end">20%</text>
    <rect x="18" y="12" width="474" height="6" rx="3" fill="#1E293B"/>
    <rect x="18" y="12" width="95" height="6" rx="3" fill="url(#jsGrad)"/>
  </g>

  <!-- Language 4: HTML5 / CSS3 / Styling -->
  <g transform="translate(24, 184)">
    <circle cx="6" cy="0" r="5" fill="#10b981"/>
    <text x="18" y="4" font-family="Consolas, Fira Code, monospace" font-size="13" font-weight="bold" fill="#F8FAFC">HTML5 / CSS3 / UI Design</text>
    <text x="492" y="4" font-family="Consolas, Fira Code, monospace" font-size="13" font-weight="bold" fill="#10b981" text-anchor="end">15%</text>
    <rect x="18" y="12" width="474" height="6" rx="3" fill="#1E293B"/>
    <rect x="18" y="12" width="71" height="6" rx="3" fill="url(#webGrad)"/>
  </g>
</svg>