<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 180" width="100%" height="100%">
  <defs>
    <!-- React Bits BorderGlow Mesh Gradient Defs -->
    <linearGradient id="pacmanBorderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#f472b6;#38bdf8;#10B981;#c084fc" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#f472b6">
        <animate attributeName="stop-color" values="#f472b6;#38bdf8;#10B981;#c084fc;#f472b6" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#10B981;#c084fc;#f472b6;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <filter id="pacmanGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="pacmanBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A101F" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <style>
      @keyframes pacmanMove {{
        0% {{ transform: translate3d(40px, 0px, 0px); }}
        100% {{ transform: translate3d(1080px, 0px, 0px); }}
      }}

      @keyframes mouthChomp {{
        0%, 100% {{ d: path('M 0 0 L 18 -12 A 22 22 0 1 0 18 12 Z'); }}
        50% {{ d: path('M 0 0 L 22 -2 A 22 22 0 1 0 22 2 Z'); }}
      }}

      @keyframes pelletEat {{
        0%, 70% {{ opacity: 1; transform: scale(1); }}
        80%, 100% {{ opacity: 0; transform: scale(0); }}
      }}

      @keyframes ghostFloat {{
        0%, 100% {{ transform: translateY(0px); }}
        50% {{ transform: translateY(-4px); }}
      }}

      .pacman-runner {{
        will-change: transform;
        animation: pacmanMove 12s linear infinite;
      }}

      .ghost-float {{
        animation: ghostFloat 1.2s ease-in-out infinite;
      }}
    </style>
  </defs>

  <!-- Container Box with React Bits BorderGlow -->
  <rect width="1180" height="180" rx="16" fill="url(#pacmanBg)" stroke="url(#pacmanBorderGlow)" stroke-width="2.5" filter="url(#pacmanGlow)"/>

  <!-- Header Text -->
  <text x="32" y="36" font-family="Consolas, Fira Code, monospace" font-size="13" font-weight="bold" fill="#22D3EE" letter-spacing="1.5">PAC-MAN / CONTRIBUTION.MAZE</text>
  <text x="1148" y="36" font-family="Consolas, Fira Code, monospace" font-size="12" font-weight="bold" fill="#10B981" text-anchor="end">LEVEL 100 -- 420,000 PTS</text>
  <line x1="32" y1="50" x2="1148" y2="50" stroke="#1E293B" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- Contribution Grid Maze Background (52 Weeks x 4 Rows) -->
  <g transform="translate(36, 70)">
    <!-- Grid Dots Grid -->
