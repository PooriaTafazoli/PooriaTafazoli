  <!-- Animated Pac-Man & Ghosts Runner -->
  <g class="pacman-runner" transform="translate(0, 110)">
    <!-- Ghosts Chasing / Following Pac-Man -->
    <g class="ghost-float" transform="translate(-160, -18)">
      <!-- Blinky (Red Ghost) -->
