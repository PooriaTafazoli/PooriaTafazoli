      <circle cx="8" cy="10" r="1.5" fill="#1E293B"/>
      <circle cx="18" cy="10" r="1.5" fill="#1E293B"/>
    </g>

    <g class="ghost-float" transform="translate(-25, -18)">
      <!-- Clyde (Orange Ghost) -->
      <path d="M0,12 A12,12 0 0,1 24,12 L24,24 L18,20 L12,24 L6,20 L0,24 Z" fill="#F59E0B"/>
      <circle cx="7" cy="10" r="3" fill="#FFFFFF"/>
      <circle cx="17" cy="10" r="3" fill="#FFFFFF"/>
      <circle cx="8" cy="10" r="1.5" fill="#1E293B"/>
      <circle cx="18" cy="10" r="1.5" fill="#1E293B"/>
    </g>

    <!-- Pac-Man Hero Eating Pellets -->
    <g transform="translate(30, 0)">
      <circle cx="0" cy="0" r="20" fill="#FACC15"/>
      <!-- Animated Wedge Mouth -->
      <path d="M 0 0 L 20 -10 A 20 20 0 0 1 20 10 Z" fill="#0A101F">
        <animate attributeName="d" values="M 0 0 L 20 -12 A 20 20 0 0 1 20 12 Z; M 0 0 L 20 -1 A 20 20 0 0 1 20 1 Z; M 0 0 L 20 -12 A 20 20 0 0 1 20 12 Z" dur="0.3s" repeatCount="indefinite" />
      </path>
      <!-- Pac-Man Eye -->
      <circle cx="2" cy="-10" r="2.5" fill="#0A101F"/>
    </g>
  </g>
</svg>